<%@ page contentType="text/html;charset=UTF-8" language="java" %>
<%@ taglib uri="http://java.sun.com/jsp/jstl/core" prefix="c" %>
<c:set var="pageTitle" value="Rooms | Exam Seating"/>
<jsp:include page="layout/header.jspf"/>

<div class="d-flex justify-content-between align-items-center mb-3">
    <h2>Rooms</h2>
    <a href="${pageContext.request.contextPath}/dashboard" class="btn btn-outline-secondary btn-sm">Back to Dashboard</a>
</div>

<div class="row">
    <div class="col-md-4">
        <div class="card mb-3">
            <div class="card-header">Add Room</div>
            <div class="card-body">
                <form method="post" action="${pageContext.request.contextPath}/rooms">
                    <input type="hidden" name="action" value="create"/>
                    <div class="mb-2">
                        <label class="form-label">Room Code</label>
                        <input type="text" name="code" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Capacity</label>
                        <input type="number" name="capacity" class="form-control" min="1" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Save</button>
                </form>
            </div>
        </div>
    </div>

    <div class="col-md-8">
        <div class="card">
            <div class="card-header">Room List</div>
            <div class="card-body p-0">
                <table class="table table-striped mb-0">
                    <thead class="table-light">
                    <tr>
                        <th>#</th>
                        <th>Code</th>
                        <th>Capacity</th>
                        <th class="text-end">Actions</th>
                    </tr>
                    </thead>
                    <tbody>
                    <c:forEach items="${rooms}" var="r" varStatus="st">
                        <tr>
                            <td>${st.index + 1}</td>
                            <td>${r.code}</td>
                            <td>${r.capacity}</td>
                            <td class="text-end">
                                <form method="post" action="${pageContext.request.contextPath}/rooms" class="d-inline">
                                    <input type="hidden" name="action" value="delete"/>
                                    <input type="hidden" name="id" value="${r.id}"/>
                                    <button type="submit" class="btn btn-sm btn-outline-danger"
                                            onclick="return confirm('Delete this room?');">Delete
                                    </button>
                                </form>
                            </td>
                        </tr>
                    </c:forEach>
                    <c:if test="${empty rooms}">
                        <tr>
                            <td colspan="4" class="text-center text-muted">No rooms found.</td>
                        </tr>
                    </c:if>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<jsp:include page="layout/footer.jspf"/>
