<%@ page contentType="text/html;charset=UTF-8" language="java" %>
<%@ taglib uri="http://java.sun.com/jsp/jstl/core" prefix="c" %>
<c:set var="pageTitle" value="Exams | Exam Seating"/>
<jsp:include page="layout/header.jspf"/>

<div class="d-flex justify-content-between align-items-center mb-3">
    <h2>Exams</h2>
    <a href="${pageContext.request.contextPath}/dashboard" class="btn btn-outline-secondary btn-sm">Back to Dashboard</a>
</div>

<div class="row">
    <div class="col-md-5">
        <div class="card mb-3">
            <div class="card-header">Add Exam</div>
            <div class="card-body">
                <form method="post" action="${pageContext.request.contextPath}/exams">
                    <input type="hidden" name="action" value="create"/>
                    <div class="mb-2">
                        <label class="form-label">Course Code</label>
                        <input type="text" name="courseCode" class="form-control" required>
                    </div>
                    <div class="mb-2">
                        <label class="form-label">Course Name</label>
                        <input type="text" name="courseName" class="form-control" required>
                    </div>
                    <div class="mb-2">
                        <label class="form-label">Exam Date</label>
                        <input type="date" name="examDate" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Start Time</label>
                        <input type="time" name="startTime" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Save</button>
                </form>
            </div>
        </div>
    </div>

    <div class="col-md-7">
        <div class="card">
            <div class="card-header">Exam List</div>
            <div class="card-body p-0">
                <table class="table table-striped mb-0">
                    <thead class="table-light">
                    <tr>
                        <th>#</th>
                        <th>Course</th>
                        <th>Date</th>
                        <th>Start</th>
                        <th class="text-end">Actions</th>
                    </tr>
                    </thead>
                    <tbody>
                    <c:forEach items="${exams}" var="e" varStatus="st">
                        <tr>
                            <td>${st.index + 1}</td>
                            <td>${e.courseCode} - ${e.courseName}</td>
                            <td>${e.examDate}</td>
                            <td>${e.startTime}</td>
                            <td class="text-end">
                                <form method="post" action="${pageContext.request.contextPath}/exams" class="d-inline">
                                    <input type="hidden" name="action" value="delete"/>
                                    <input type="hidden" name="id" value="${e.id}"/>
                                    <button type="submit" class="btn btn-sm btn-outline-danger"
                                            onclick="return confirm('Delete this exam?');">Delete
                                    </button>
                                </form>
                            </td>
                        </tr>
                    </c:forEach>
                    <c:if test="${empty exams}">
                        <tr>
                            <td colspan="5" class="text-center text-muted">No exams found.</td>
                        </tr>
                    </c:if>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<jsp:include page="layout/footer.jspf"/>
